        // ── Verificación de calidad (QC) ──
        async function verificarLineaOrder(el) {
            const verificado = el.checked;
            el.disabled = true;
            try {
                const res = await fetch('/api/order/despacho/verificar', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ idOrderPicking: parseInt(el.dataset.op), product: el.dataset.prod, verificado })
                });
                if (!res.ok) throw new Error();
                el.closest('.prod-row').classList.toggle('verificado', verificado);
            } catch { el.checked = !verificado; alert('Error al guardar la verificación'); }
            finally { el.disabled = false; }
        }
        async function verificarLineaProducto(el) {
            const verificado = el.checked;
            el.disabled = true;
            try {
                const res = await fetch('/api/despacho/verificar', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ routeNumber: parseInt(el.dataset.rn), ovNumber: el.dataset.ov, product: el.dataset.prod, verificado })
                });
                if (!res.ok) throw new Error();
                el.closest('.prod-row').classList.toggle('verificado', verificado);
            } catch { el.checked = !verificado; alert('Error al guardar la verificación'); }
            finally { el.disabled = false; }
        }

        // ── Packing lists ──
        function printPackingOrder(idOrderPicking) {
            window.open('/packing-list-print.html?mode=order&idRoutePlan=' + selectedRoutePlanId + '&pedido=' + idOrderPicking, '_blank');
        }
        function printPackingAllOrder(idRoutePlan) {
            window.open('/packing-list-print.html?mode=order&idRoutePlan=' + idRoutePlan, '_blank');
        }
        function printPackingProducto(routeNumber, ovNumber) {
            window.open('/packing-list-print.html?mode=product&routeNumber=' + routeNumber + '&ov=' + encodeURIComponent(ovNumber), '_blank');
        }
        function printPackingAllProducto(routeNumber) {
            window.open('/packing-list-print.html?mode=product&routeNumber=' + routeNumber, '_blank');
        }

        // ── Etiquetas 4x8 (una por bulto de cada OV) ──
        // Recolecta el # de bultos por OV desde los inputs del detalle y lo deja en
        // localStorage para que la página de etiquetas genere 1/X, 2/X … por OV.
        // Suma el # de bultos de todas las OVs de la ruta abierta → total que carga el camión.
        function actualizarBultosTotal() {
            const el = document.getElementById('rutaBultosTotal');
            if (!el) return;
            let total = 0, ovs = 0;
            document.querySelectorAll('.bultos-input').forEach(inp => {
                let n = parseInt(inp.value, 10);
                if (!Number.isFinite(n) || n < 1) n = 1;
                total += n; ovs++;
            });
            el.textContent = ovs ? (total + ' bulto' + (total === 1 ? '' : 's')) : '—';
        }

        function guardarBultos() {
            const map = {};
            document.querySelectorAll('.bultos-input').forEach(inp => {
                const ov = inp.getAttribute('data-ov');
                let n = parseInt(inp.value, 10);
                if (!ov) return;
                if (!Number.isFinite(n) || n < 1) n = 1;
                map[ov] = n;
            });
            try { localStorage.setItem('etiquetasBultos', JSON.stringify(map)); } catch (e) {}
        }
        function printEtiquetasOrder(idRoutePlan) {
            guardarBultos();
            window.open('/etiqueta-print.html?mode=order&idRoutePlan=' + idRoutePlan, '_blank');
        }
        function printEtiquetaOrder(idOrderPicking, ovNumber) {
            guardarBultos();
            window.open('/etiqueta-print.html?mode=order&idRoutePlan=' + selectedRoutePlanId + '&pedido=' + idOrderPicking, '_blank');
        }
        function printEtiquetasProducto(routeNumber) {
            guardarBultos();
            window.open('/etiqueta-print.html?mode=product&routeNumber=' + routeNumber, '_blank');
        }
        function printEtiquetaProducto(routeNumber, ovNumber) {
            guardarBultos();
            window.open('/etiqueta-print.html?mode=product&routeNumber=' + routeNumber + '&ov=' + encodeURIComponent(ovNumber), '_blank');
        }

        function esc(str) {
            if (!str) return '';
            const d = document.createElement('div');
            d.textContent = str;
            return d.innerHTML;
        }

        function formatNum(n) {
            return parseFloat(n || 0).toLocaleString('es-GT', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>

    <!-- Modal: asignar placa al cuadro (busca en @camiones de SAP) -->
    <div class="placa-modal-overlay" id="placaModalOverlay">
        <div class="placa-modal">
            <div class="placa-modal-head">
                <h3><i class="bi bi-truck"></i> Asignar placa — Cuadro <span id="placaModalRN"></span></h3>
                <button type="button" onclick="cerrarAsignarPlaca()">&times;</button>
            </div>
            <div class="placa-modal-body">
                <input type="text" id="placaBuscarInput" placeholder="Buscar por placa, proveedor o piloto…" autocomplete="off" oninput="buscarCamionDebounced()">
                <div class="placa-modal-sub">Escribe para buscar la unidad en SAP (@camiones).</div>
                <div class="placa-result-list" id="placaResultList">
                    <div class="placa-modal-empty">Escribe para buscar una unidad.</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal: qué hacer con los documentos quitados -->
    <div class="placa-modal-overlay" id="editModalOverlay">
        <div class="placa-modal edit-modal">
            <div class="placa-modal-head">
                <h3><i class="bi bi-box-arrow-right"></i> Documentos quitados</h3>
                <button type="button" onclick="cerrarDestinoModal()">&times;</button>
            </div>
            <div class="placa-modal-body" id="editModalBody"></div>
        </div>
    </div>
</body>
</html>
