<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Despacho - Picking por Producto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #d4a826;
            --primary-dark: #b8941f;
            --dark: #222222;
            --dark-light: #2d2d2d;
            --success: #2e7d32;
            --danger: #c62828;
            --blue: #1565c0;
            --bg: #f5f5f5;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: var(--dark);
            color: white;
            padding: 0.6rem 1.2rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid var(--primary);
            flex-shrink: 0;
        }

        .header .brand { font-size: 0.7rem; font-weight: 800; letter-spacing: 2px; color: var(--primary); }
        .header h1 { font-size: 1rem; font-weight: 700; }
        .header h1 i { color: var(--primary); }

        .btn-link {
            background: transparent; border: 1px solid #555; color: #ccc;
            padding: 0.3rem 0.6rem; border-radius: 6px; cursor: pointer;
            font-size: 0.78rem; text-decoration: none; transition: all 0.2s;
        }
        .btn-link:hover { background: #444; color: white; }

        /* ── Master-Detail: left carriles | right detail ── */
        .app-layout {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* ── Left panel: Carriles stacked vertically ── */
        .panel-carriles {
            width: 380px;
            min-width: 320px;
            background: white;
            border-right: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .panel-carriles-header {
            padding: 0.5rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e8e8e8;
            flex-shrink: 0;
        }

        .panel-carriles-header h3 {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--dark);
        }

        .panel-carriles-header select {
            padding: 0.25rem 0.5rem;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 0.75rem;
            outline: none;
        }

        .carriles-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 0.5rem;
        }

        /* Each carril is a row stacked vertically */
        .carril-row {
            margin-bottom: 0.5rem;
            border: 1px solid #e8e8e8;
            border-radius: 8px;
            overflow: hidden;
        }

        .carril-row-header {
            background: var(--dark);
            color: white;
            padding: 0.35rem 0.7rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.78rem;
        }

        .carril-row-header h4 {
            font-size: 0.75rem;
            font-weight: 700;
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .carril-row-header h4 i { color: var(--primary); margin-right: 0.15rem; }

        .carril-row-header .badge-count {
            background: var(--primary); color: var(--dark);
            padding: 0.05rem 0.35rem; border-radius: 8px;
            font-size: 0.65rem; font-weight: 700;
        }

        /* Routes inside carril: horizontal scroll */
        .carril-routes {
            display: flex;
            overflow-x: auto;
            gap: 0.4rem;
            padding: 0.4rem;
        }

        .carril-routes::-webkit-scrollbar { height: 3px; }
        .carril-routes::-webkit-scrollbar-thumb { background: #ccc; border-radius: 2px; }

        /* ── Kanban vertical (Despacho): 3 slots por estado ── */
        .kanban-slot { margin-bottom: 0.7rem; border: 1px solid #e8e8e8; border-radius: 8px; overflow: hidden; }
        .kanban-slot-header {
            padding: 0.45rem 0.7rem; display: flex; align-items: center; gap: 0.4rem;
            font-size: 0.75rem; font-weight: 700; color: #fff;
        }
        .kanban-slot-header i { font-size: 0.85rem; }
        .kanban-slot-header .badge-count {
            margin-left: auto; background: rgba(255,255,255,0.28); color: #fff;
            padding: 0.05rem 0.4rem; border-radius: 8px; font-size: 0.65rem; font-weight: 700;
        }
        .kanban-slot.slot-picking .kanban-slot-header { background: #8a6d1a; }
        .kanban-slot.slot-completado .kanban-slot-header { background: #1565c0; }
        .kanban-slot.slot-listo .kanban-slot-header { background: #2e7d32; }
        .kanban-routes { display: flex; flex-direction: column; gap: 0.4rem; padding: 0.4rem; }
        .kanban-routes:empty::after {
            content: 'Sin rutas'; color: #bbb; font-size: 0.7rem; padding: 0.35rem 0.2rem; text-align: center;
        }
        .kanban-routes .route-chip { min-width: 0; max-width: none; width: 100%; }

        /* ── Route chip (compact, horizontal) ── */
        .route-chip {
            min-width: 140px;
            max-width: 180px;
            flex-shrink: 0;
            padding: 0.4rem 0.6rem;
            border-radius: 6px;
            cursor: pointer;
            border: 1px solid #e8e8e8;
            transition: all 0.15s;
        }

        .route-chip:hover { box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
        .route-chip.active { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(212,168,38,0.3); }

        .route-chip.estado-pendiente { background: rgba(212,168,38,0.08); }
        .route-chip.estado-listo { background: rgba(46,125,50,0.08); }
        .route-chip.estado-finalizado { background: rgba(21,101,192,0.08); }

        .rc-title {
            font-weight: 700;
            font-size: 0.72rem;
            color: var(--dark);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .rc-meta {
            font-size: 0.62rem;
            color: #999;
            margin-top: 1px;
        }

        .rc-bar {
            width: 100%;
            height: 3px;
            background: #e0e0e0;
            border-radius: 2px;
            margin-top: 4px;
            overflow: hidden;
        }
        .rc-bar .fill {
            height: 100%;
            border-radius: 2px;
            background: var(--primary);
            transition: width 0.3s;
        }
        .rc-bar .fill.complete { background: var(--success); }

        .rc-pct {
            font-size: 0.62rem;
            font-weight: 700;
            color: #999;
            text-align: right;
            margin-top: 1px;
        }

        /* ── Right panel: Detail ── */
        .panel-detail {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            background: var(--bg);
        }

        .empty-detail {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #bbb;
        }

        .empty-detail i { font-size: 3rem; margin-bottom: 0.8rem; opacity: 0.4; }
        .empty-detail p { font-size: 0.9rem; }

        /* ── Route header card ── */
        .route-header-card {
            background: white;
            border-radius: 12px;
            padding: 1.2rem 1.5rem;
            margin-bottom: 1rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .route-header-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.8rem;
        }

        .btn-print-cuadro {
            background: #222;
            color: #d4a826;
            border: 1px solid #d4a826;
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.15s;
        }
        .btn-print-cuadro:hover {
            background: #d4a826;
            color: #222;
        }
        .btn-print-cuadro i { margin-right: 0.3rem; }

        /* Salto de línea dentro del contenedor flex de botones */
        .btns-break { flex-basis: 100%; height: 0; margin: 0; }
        /* Etiquetas de empaque: naranja llamativo */
        .btn-etiquetas {
            background: #ff6a00;
            color: #fff;
            border-color: #ff6a00;
            box-shadow: 0 2px 6px rgba(255,106,0,0.35);
        }
        .btn-etiquetas:hover { background: #e65c00; border-color: #e65c00; color: #fff; }

        .route-header-print { display: flex; flex-direction: column; gap: 0.4rem; }
        .route-header-btns { display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: flex-end; align-items: flex-start; }
        /* Todos los botones del header al mismo tamaño */
        .route-header-btns button { min-width: 210px; text-align: center; }
        /* Acciones de documentación: columna de impresión + botón cuadrado de editar */
        .header-doc-actions { display: flex; gap: 0.5rem; align-items: stretch; }
        .header-doc-actions .print-col { display: flex; flex-direction: column; gap: 0.4rem; }
        .route-header-btns .header-doc-actions button { min-width: 170px; }
        .route-header-btns .header-doc-actions .btn-edit-sq,
        .route-header-btns .header-doc-actions .edit-sq-group button { min-width: 0; }
        .edit-sq-group { display: flex; flex-direction: column; gap: 0.4rem; }
        .btn-edit-sq {
            width: 92px; align-self: stretch; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 0.25rem;
            background: #fff3e0; color: #e65100; border: 1px solid #ffb74d;
            border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 0.74rem; padding: 0.4rem;
        }
        .btn-edit-sq i { font-size: 1.35rem; margin: 0; }
        .btn-edit-sq:hover { background: #ffe0b2; }
        .btn-edit-sq.guardar { background: #2e7d32; color: #fff; border-color: #2e7d32; }
        .btn-edit-sq.guardar:hover { background: #1b5e20; }
        .btn-edit-cancel { width: 92px; background: #fff; color: #777; border: 1px solid #cfd8e3; border-radius: 8px; cursor: pointer; font-size: 0.72rem; font-weight: 600; padding: 0.35rem; }
        .btn-edit-cancel:hover { background: #f1f1f1; }
        /* Barra de agregar documento (modo edición, en la cabecera) */
        .edit-add-bar { margin-top: 0.8rem; padding: 0.7rem 0.8rem; background: #fff8e1; border: 1px dashed #ffb74d; border-radius: 8px; }
        .edit-add-bar .eab-row { display: flex; gap: 0.4rem; align-items: center; flex-wrap: wrap; }
        .edit-add-bar select, .edit-add-bar input { padding: 0.45rem 0.6rem; border: 1px solid #cfd8e3; border-radius: 6px; font-size: 0.88rem; }
        .edit-add-bar input { flex: 1; min-width: 160px; }
        .edit-add-bar button { padding: 0.45rem 0.9rem; border: none; border-radius: 6px; background: #1565c0; color: #fff; font-weight: 600; cursor: pointer; white-space: nowrap; }
        .edit-add-bar .eab-preview { font-size: 0.82rem; color: #445; margin-top: 0.4rem; min-height: 1rem; }
        .edit-add-bar .eab-preview .warn { color: #e65100; }
        /* Tarjetas de doc en modo edición */
        .doc-card.rm-marked { opacity: 0.55; border-color: #ef9a9a; }
        .doc-card.add-new { border-color: #a5d6a7; background: #f1f8f2; }
        .btn-doc-rm { background: #fff; border: 1px solid #ef9a9a; color: #c62828; border-radius: 6px; padding: 0.3rem 0.7rem; font-size: 0.78rem; font-weight: 600; cursor: pointer; white-space: nowrap; }
        .btn-doc-rm.deshacer { border-color: #90caf9; color: #1565c0; }
        .btn-completar {
            background: #2e7d32; color: #fff; border: 1px solid #2e7d32;
            padding: 0.4rem 0.9rem; border-radius: 6px; font-size: 0.78rem; font-weight: 600;
            cursor: pointer; white-space: nowrap; transition: all 0.15s;
        }
        .btn-completar:hover:not(:disabled) { background: #1b5e20; border-color: #1b5e20; }
        .btn-completar:disabled { background: #9ccc9f; border-color: #9ccc9f; cursor: default; }
        .btn-completar i { margin-right: 0.3rem; }
        .btn-listo {
            background: #1565c0; color: #fff; border: 1px solid #1565c0;
            padding: 0.4rem 0.9rem; border-radius: 6px; font-size: 0.78rem; font-weight: 600;
            cursor: pointer; white-space: nowrap; transition: all 0.15s;
        }
        .btn-listo:hover:not(:disabled) { background: #0d47a1; border-color: #0d47a1; }
        .btn-listo:disabled { background: #a8c7e8; border-color: #a8c7e8; cursor: default; }
        .btn-listo i { margin-right: 0.3rem; }
        .placa-pendiente { color: #c62828; font-weight: 700; }
        .btn-asignar-placa {
            margin-top: 0.4rem; background: #eef4fb; color: #1565c0;
            border: 1px solid #90caf9; border-radius: 6px; padding: 0.25rem 0.6rem;
            font-size: 0.78rem; font-weight: 600; cursor: pointer; white-space: nowrap;
        }
        .btn-asignar-placa:hover { background: #e3f2fd; }
        .btn-asignar-placa i { margin-right: 0.3rem; }
        /* Modal asignar placa */
        .placa-modal-overlay {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45);
            z-index: 2000; align-items: flex-start; justify-content: center;
        }
        .placa-modal-overlay.show { display: flex; }
        .placa-modal {
            background: #fff; border-radius: 10px; width: 480px; max-width: 94vw;
            margin-top: 8vh; box-shadow: 0 10px 40px rgba(0,0,0,0.3); overflow: hidden;
        }
        .placa-modal-head {
            display: flex; justify-content: space-between; align-items: center;
            padding: 0.9rem 1.1rem; border-bottom: 1px solid #e0e0e0; background: #f7f9fc;
        }
        .placa-modal-head h3 { margin: 0; font-size: 1.05rem; color: #1a3a5c; }
        .placa-modal-head button { background: none; border: none; font-size: 1.3rem; cursor: pointer; color: #888; }
        .placa-modal-body { padding: 1.1rem; }
        .placa-modal-body input[type=text] {
            width: 100%; padding: 0.6rem 0.8rem; border: 1px solid #cfd8e3;
            border-radius: 6px; font-size: 0.95rem; box-sizing: border-box;
        }
        .placa-modal-sub { font-size: 0.8rem; color: #667; margin: 0.35rem 0 0.6rem; }
        .placa-result-list { max-height: 320px; overflow-y: auto; margin-top: 0.4rem; }
        .placa-result {
            display: flex; justify-content: space-between; align-items: center;
            padding: 0.55rem 0.7rem; border: 1px solid #e6ebf1; border-radius: 6px;
            margin-bottom: 0.4rem; cursor: pointer;
        }
        .placa-result:hover { background: #f0f6ff; border-color: #90caf9; }
        .placa-result .pr-main { font-weight: 700; color: #1a3a5c; }
        .placa-result .pr-sub { font-size: 0.78rem; color: #667; }
        .placa-result .pr-cap { font-size: 0.78rem; color: #2e7d32; font-weight: 600; }
        .placa-modal-empty { text-align: center; color: #999; padding: 1rem; font-size: 0.9rem; }
        /* Modal editar cuadro */
        .edit-modal { width: 620px; }
        .edit-section { margin-bottom: 1.1rem; }
        .edit-section h4 { margin: 0 0 0.5rem; font-size: 0.9rem; color: #1a3a5c; text-transform: uppercase; letter-spacing: .03em; }
        .edit-add-row { display: flex; gap: 0.4rem; align-items: center; }
        .edit-add-row select, .edit-add-row input { padding: 0.5rem 0.6rem; border: 1px solid #cfd8e3; border-radius: 6px; font-size: 0.9rem; }
        .edit-add-row input { flex: 1; }
        .edit-add-row button { padding: 0.5rem 0.8rem; border: none; border-radius: 6px; background: #1565c0; color: #fff; font-weight: 600; cursor: pointer; white-space: nowrap; }
        .edit-doc-row { display: flex; justify-content: space-between; align-items: center; padding: 0.5rem 0.65rem; border: 1px solid #e6ebf1; border-radius: 6px; margin-bottom: 0.35rem; font-size: 0.9rem; }
        .edit-doc-row.marcado-quitar { background: #ffebee; border-color: #ef9a9a; text-decoration: line-through; color: #b71c1c; }
        .edit-doc-row.nuevo { background: #e8f5e9; border-color: #a5d6a7; }
        .edit-doc-row .edr-main { font-weight: 600; color: #1a3a5c; }
        .edit-doc-row .edr-sub { font-size: 0.76rem; color: #667; font-weight: 400; }
        .edit-doc-row.marcado-quitar .edr-main, .edit-doc-row.nuevo .edr-main { color: inherit; }
        .edit-doc-row button { background: none; border: 1px solid #cfd8e3; border-radius: 5px; padding: 0.2rem 0.5rem; cursor: pointer; font-size: 0.78rem; }
        .edit-doc-row button.danger { color: #c62828; border-color: #ef9a9a; }
        .edit-preview { font-size: 0.82rem; color: #445; margin-top: 0.35rem; min-height: 1.1rem; }
        .edit-preview .warn { color: #e65100; }
        .edit-footer { display: flex; justify-content: flex-end; gap: 0.5rem; padding: 0.9rem 1.1rem; border-top: 1px solid #e0e0e0; background: #f7f9fc; }
        .edit-footer button { padding: 0.55rem 1.1rem; border-radius: 6px; font-weight: 600; cursor: pointer; border: 1px solid transparent; }
        .edit-footer .btn-cancelar { background: #fff; border-color: #cfd8e3; color: #555; }
        .edit-footer .btn-guardar { background: #2e7d32; color: #fff; }
        .edit-footer .btn-guardar:disabled { background: #a5d6a7; cursor: default; }
        .destino-choice { display: flex; flex-direction: column; gap: 0.5rem; }
        .destino-choice button { padding: 0.7rem 0.9rem; border: 1px solid #cfd8e3; border-radius: 8px; background: #fff; cursor: pointer; text-align: left; font-size: 0.9rem; }
        .destino-choice button:hover { background: #f0f6ff; border-color: #90caf9; }
        .destino-choice button b { color: #1a3a5c; }
        .btn-print-packing {
            background: #2e7d32;
            color: #fff;
            border: 1px solid #2e7d32;
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.15s;
        }
        .btn-print-packing:hover { background: #1b5e20; border-color: #1b5e20; }
        .btn-print-packing i { margin-right: 0.3rem; }

        /* Botón pequeño de impresión por pedido */
        .btn-print-pedido {
            background: transparent;
            color: #2e7d32;
            border: 1px solid #cfe0cf;
            width: 30px; height: 30px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            display: inline-flex; align-items: center; justify-content: center;
            flex: none;
            transition: all 0.15s;
        }
        .btn-print-pedido:hover { background: #2e7d32; color: #fff; border-color: #2e7d32; }

        /* Control de bultos por OV (para las etiquetas de empaque) */
        .bultos-ctrl { display: flex; flex-direction: column; align-items: center; gap: 1px; flex: none; }
        .bultos-ctrl label { font-size: 0.55rem; text-transform: uppercase; letter-spacing: 0.04em; color: #999; font-weight: 700; }
        .bultos-input {
            width: 48px; height: 30px; text-align: center; font-weight: 700; font-size: 0.85rem;
            border: 1px solid #ffb380; border-radius: 6px; color: #b34700; background: #fff8f2;
        }
        .bultos-input:focus { outline: none; border-color: #ff6a00; box-shadow: 0 0 0 2px rgba(255,106,0,0.2); }

        /* Checkbox de verificación QC */
        .qc-check { position: relative; display: inline-flex; align-items: center; cursor: pointer; flex: none; margin-left: 0.5rem; }
        .qc-check input { position: absolute; opacity: 0; width: 22px; height: 22px; margin: 0; cursor: pointer; }
        .qc-check span {
            width: 22px; height: 22px; border-radius: 5px;
            border: 2px solid #bbb; background: #fff;
            display: inline-flex; align-items: center; justify-content: center;
            transition: all 0.12s;
        }
        .qc-check span::after {
            content: '\2713'; color: #fff; font-size: 0.85rem; font-weight: 700; opacity: 0;
        }
        .qc-check input:checked + span { background: #2e7d32; border-color: #2e7d32; }
        .qc-check input:checked + span::after { opacity: 1; }
        .qc-check input:disabled + span { opacity: 0.5; }
        .prod-row.verificado { background: rgba(46,125,50,0.07); }
        .prod-row.verificado .prod-name { color: #1b5e20; }

        .route-header-title {
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--dark);
        }

        .route-header-subtitle {
            font-size: 0.85rem;
            color: #666;
            margin-top: 0.15rem;
        }

        .route-header-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 0.8rem;
            margin-bottom: 0.8rem;
        }

        .rh-field label {
            font-size: 0.68rem;
            text-transform: uppercase;
            color: #999;
            font-weight: 600;
            display: block;
            margin-bottom: 0.1rem;
        }

        .rh-field .value {
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--dark);
        }

        .estado-pill {
            display: inline-block;
            padding: 0.15rem 0.5rem;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 700;
        }

        .estado-pill.pendiente { background: rgba(212,168,38,0.15); color: #b8941f; }
        .estado-pill.listo-carga { background: rgba(46,125,50,0.12); color: var(--success); }
        .estado-pill.finalizado-despacho { background: rgba(21,101,192,0.1); color: var(--blue); }
        .estado-pill.picking-iniciado { background: rgba(255,152,0,0.12); color: #e65100; }
        .estado-pill.picking-finalizado { background: rgba(46,125,50,0.12); color: var(--success); }
        .estado-pill.pase-generado { background: #e1f3fc; color: #1565c0; }

        .route-header-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        .btn-estado {
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: opacity 0.2s;
        }

        .btn-estado:hover { opacity: 0.85; }
        .btn-estado:disabled { opacity: 0.35; cursor: not-allowed; }

        .btn-listo { background: var(--success); color: white; }
        .btn-finalizar-despacho { background: var(--blue); color: white; }
        .btn-revertir { background: #eee; color: #666; border: 1px solid #ddd; }

        .picking-bar-lg {
            height: 6px;
            background: #e8e8e8;
            border-radius: 3px;
            overflow: hidden;
            margin-top: 0.6rem;
        }

        .picking-bar-lg .fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.3s;
        }

        .picking-bar-lg .fill.complete { background: var(--success); }
        .picking-bar-lg .fill.in-progress { background: var(--primary); }

        /* ── Documents list ── */
        .docs-header {
            font-size: 0.88rem;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 0.6rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .docs-header .badge-count {
            background: var(--primary);
            color: var(--dark);
            padding: 0.1rem 0.45rem;
            border-radius: 8px;
            font-size: 0.7rem;
            font-weight: 700;
        }

        .doc-card {
            background: white;
            border-radius: 10px;
            margin-bottom: 0.5rem;
            box-shadow: 0 1px 4px rgba(0,0,0,0.04);
            overflow: hidden;
            border: 1px solid #e8e8e8;
        }

        .doc-card-header {
            padding: 0.6rem 1rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            transition: background 0.1s;
        }

        .doc-card-header:hover { background: #fafafa; }

        .doc-icon { font-size: 1rem; flex-shrink: 0; }
        .doc-icon.done { color: var(--success); }
        .doc-icon.pending { color: #ccc; }

        .doc-info { flex: 1; min-width: 0; }

        .doc-name {
            font-weight: 700;
            font-size: 0.85rem;
            color: var(--dark);
        }

        .doc-meta {
            font-size: 0.72rem;
            color: #999;
        }

        .doc-right {
            text-align: right;
            flex-shrink: 0;
        }

        .doc-weight {
            font-size: 0.78rem;
            font-weight: 600;
            color: #555;
        }

        .doc-status {
            font-size: 0.65rem;
        }

        .doc-toggle {
            color: #ccc;
            font-size: 0.85rem;
            transition: transform 0.2s;
            flex-shrink: 0;
        }

        .doc-toggle.open { transform: rotate(90deg); }

        /* ── Products inside document ── */
        .doc-products {
            display: none;
            border-top: 1px solid #f0f0f0;
            padding: 0.4rem 1rem 0.6rem 2.6rem;
        }

        .doc-products.open { display: block; }

        .prod-row {
            display: flex;
            align-items: center;
            padding: 0.3rem 0;
            gap: 0.5rem;
            font-size: 0.72rem;
            border-bottom: 1px solid #f8f8f8;
        }

        .prod-row:last-child { border-bottom: none; }

        .prod-icon { font-size: 0.75rem; flex-shrink: 0; }
        .prod-icon.done { color: var(--success); }
        .prod-icon.pending { color: #ddd; }

        .prod-name {
            flex: 1; min-width: 0;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            color: #555;
        }

        .prod-qty {
            flex-shrink: 0;
            font-weight: 600;
            color: #777;
        }

        .prod-qty.done { color: var(--success); }

        .loading-detail {
            text-align: center;
            padding: 2rem;
            color: #aaa;
        }

        @media (max-width: 768px) {
            .app-layout { flex-direction: column; }
            .panel-carriles { width: 100%; min-width: 100%; max-height: 35vh; border-right: none; border-bottom: 1px solid #e0e0e0; }
            .panel-detail { padding: 0.8rem; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <div class="brand">FERCO CERAMICA</div>
            <h1><i class="bi bi-truck"></i> Gestion de Despacho</h1>
        </div>
        <a href="/dashboard" class="btn-link"><i class="bi bi-arrow-left"></i> Dashboard</a>
    </div>

    <div class="app-layout">
        <!-- Left: Carriles stacked, routes horizontal inside -->
        <div class="panel-carriles">
            <div class="panel-carriles-header">
                <h3><i class="bi bi-kanban" style="color:var(--primary)"></i> Tablero</h3>
                <select id="centroFilter" onchange="renderCarriles()">
                    <option value="">Todos</option>
                </select>
            </div>
            <div class="carriles-scroll" id="carrilesList"></div>
        </div>

        <!-- Right: Detail -->
        <div class="panel-detail" id="panelDetail">
            <div class="empty-detail">
                <i class="bi bi-cursor"></i>
                <p>Selecciona una ruta para ver sus documentos</p>
            </div>
        </div>
    </div>

    <script>
        let despachoData = [];
        let allCarriles = [];
        let selectedRoute = null;
        let selectedRoutePlanId = null;
        let openDocs = new Set();
        let refreshTimer = null;
        let pickingMode = 'product'; // 'product' or 'order'
        let userPais = 'GT';
        let puedeEditarCuadro = false; // priorizacion/operativo/Admin → puede asignar placa

        async function init() {
            try {
                const res = await fetch('/api/auth/me');
                if (!res.ok) { window.location.href = '/login'; return; }
                const user = await res.json();
                userPais = user.selectedPais || 'GT';
                puedeEditarCuadro = user.rol === 'Admin' || (user.permisos && (user.permisos.includes('priorizacion') || user.permisos.includes('reportes_operativo')));
                const modo = user.selectedModo || (['SV', 'HN'].includes(userPais) ? 'order' : 'product');
                pickingMode = modo === 'order' ? 'order' : 'product';
            } catch { window.location.href = '/login'; return; }

            await loadCentros();
            await loadAllCarriles();
            await loadDespacho();
            refreshTimer = setInterval(loadDespacho, 30000);
        }

        async function loadCentros() {
            try {
                const res = await fetch('/api/centros');
                const centros = await res.json();
                const select = document.getElementById('centroFilter');
                centros.forEach(c => {
                    const opt = document.createElement('option');
                    opt.value = c.ID_Centro;
                    opt.textContent = c.Nombre;
                    select.appendChild(opt);
                });
            } catch (err) { console.error(err); }
        }

        async function loadAllCarriles() {
            try {
                const res = await fetch('/api/carriles');
                allCarriles = await res.json();
            } catch (err) { console.error(err); }
        }

        async function loadDespacho() {
            try {
                const url = pickingMode === 'order' ? '/api/order/despacho/rutas' : '/api/despacho/rutas';
                const res = await fetch(url);
                despachoData = await res.json();
                renderCarriles();
            } catch (err) { console.error(err); }
        }

        // Kanban vertical: 3 slots por estado de la ruta
        //   1) En proceso de picking   → Estado 'Iniciado'
        //   2) Picking completado      → Estado 'Finalizado' y EstadoDespacho 'Pendiente'
        //   3) Listas para despachar   → EstadoDespacho 'Listo para Carga'
        function renderCarriles() {
            const container = document.getElementById('carrilesList');
            const centroFilter = document.getElementById('centroFilter').value;

            let routes = despachoData;
            if (centroFilter) routes = routes.filter(r => r.ID_Centro == centroFilter);

            const slotPicking = [], slotCompletado = [], slotListo = [];
            routes.forEach(r => {
                const ed = r.EstadoDespacho || 'Pendiente';
                if (ed === 'Finalizado') return;              // ya despachada, sale del tablero
                if (ed === 'Listo para Carga') slotListo.push(r);
                else if (r.Estado === 'Finalizado') slotCompletado.push(r);
                else slotPicking.push(r);                     // Iniciado / en picking
            });

            const byRoute = (a, b) => (a.RouteNumber || 0) - (b.RouteNumber || 0);
            [slotPicking, slotCompletado, slotListo].forEach(s => s.sort(byRoute));

            const slotHtml = (cls, icon, titulo, list) => `
                <div class="kanban-slot ${cls}">
                    <div class="kanban-slot-header">
                        <i class="bi ${icon}"></i> ${titulo}
                        <span class="badge-count">${list.length}</span>
                    </div>
                    <div class="kanban-routes">${list.map(r => renderRouteChip(r)).join('')}</div>
                </div>`;

            container.innerHTML =
                slotHtml('slot-picking', 'bi-hourglass-split', 'En proceso de picking', slotPicking) +
                slotHtml('slot-completado', 'bi-box-seam', 'Picking completado', slotCompletado) +
                slotHtml('slot-listo', 'bi-truck', 'Listas para despachar', slotListo);
        }

        function renderRouteChip(r) {
            const estadoDespacho = r.EstadoDespacho || 'Pendiente';
            const totalItems = pickingMode === 'order' ? (r.TotalPedidos || 0) : (r.TotalProductos || 0);
            const finItems = pickingMode === 'order' ? (r.PedidosFinalizados || 0) : (r.ProductosFinalizados || 0);
            const pickingPct = totalItems > 0 ? Math.round((finItems / totalItems) * 100) : 0;
            let estadoClass = 'estado-pendiente';
            if (estadoDespacho === 'Listo para Carga') estadoClass = 'estado-listo';
            if (estadoDespacho === 'Finalizado') estadoClass = 'estado-finalizado';

            const isActive = pickingMode === 'order'
                ? selectedRoutePlanId === r.ID_RoutePlan
                : selectedRoute === r.RouteNumber;

            const onClickFn = pickingMode === 'order'
                ? `selectRouteOrder(${r.ID_RoutePlan}, ${r.RouteNumber})`
                : `selectRoute(${r.RouteNumber})`;

            return `
                <div class="route-chip ${estadoClass} ${isActive ? 'active' : ''}" onclick="${onClickFn}">
                    <div class="rc-title">#${r.RouteNumber} — ${esc(r.RouteName || '')}</div>
                    <div class="rc-meta">${formatNum(r.PesoEstimado || 0)} kg</div>
                    <div class="rc-bar"><div class="fill ${pickingPct === 100 ? 'complete' : ''}" style="width:${pickingPct}%"></div></div>
                    <div class="rc-pct">${pickingPct}%</div>
                </div>
            `;
        }

        async function selectRoute(routeNumber) {
            selectedRoute = routeNumber;
            openDocs = new Set();
            renderCarriles();

            const panel = document.getElementById('panelDetail');
            panel.innerHTML = '<div class="loading-detail"><i class="bi bi-hourglass-split"></i> Cargando...</div>';

            const ruta = despachoData.find(r => r.RouteNumber === routeNumber);
            if (!ruta) return;

            try {
                const res = await fetch('/api/despacho/rutas/' + routeNumber + '/documentos');
                if (!res.ok) {
                    const errData = await res.json().catch(() => ({}));
                    throw new Error(errData.error || 'HTTP ' + res.status);
                }
                const docs = await res.json();
                renderDetail(ruta, docs);
                cargarPlaca(routeNumber);
            } catch (err) {
                console.error('Error cargando documentos:', err);
                panel.innerHTML = '<div class="loading-detail" style="color:#c62828"><i class="bi bi-exclamation-triangle"></i> Error al cargar documentos: ' + esc(err.message) + '</div>';
            }
        }

        function renderDetail(ruta, docs) {
            const panel = document.getElementById('panelDetail');
            const estadoDespacho = ruta.EstadoDespacho || 'Pendiente';
            const estadoPicking = ruta.Estado || 'Iniciado';
            const pickingPct = ruta.TotalProductos > 0 ? Math.round((ruta.ProductosFinalizados / ruta.TotalProductos) * 100) : 0;
            const pickingComplete = estadoPicking === 'Finalizado';

            let despachoPillClass = 'pendiente';
            if (estadoDespacho === 'Listo para Carga') despachoPillClass = 'listo-carga';
            if (estadoDespacho === 'Finalizado') despachoPillClass = 'finalizado-despacho';

            let pickingPillClass = pickingComplete ? 'picking-finalizado' : 'picking-iniciado';

            const yaCompletado = estadoDespacho === 'Finalizado';
            const docsFinalizados = docs.filter(d => d.Estado === 'Finalizado').length;

            panel.innerHTML = `
                <div class="route-header-card">
                    <div class="route-header-top">
                        <div>
                            <div class="route-header-title">#${ruta.RouteNumber} — ${esc(ruta.RouteName || '')}</div>
                            <div class="route-header-subtitle"><i class="bi bi-signpost-2" style="color:var(--primary)"></i> ${esc(ruta.CarrilNombre || 'Sin carril')}</div>
                        </div>
                        <div class="route-header-btns">
                            <button class="btn-listo" ${(!pickingComplete || estadoDespacho !== 'Pendiente') ? 'disabled' : ''} onclick="cambiarEstado(${ruta.RouteNumber}, 'Listo para Carga')" title="${!pickingComplete ? 'El picking debe estar finalizado' : (estadoDespacho !== 'Pendiente' ? 'Ya está lista para carga' : 'Revisar y marcar como lista para carga')}">
                                <i class="bi bi-box-seam"></i> ${estadoDespacho === 'Pendiente' ? 'Lista para Carga' : 'Lista para Carga ✓'}
                            </button>
                            <button class="btn-completar" ${estadoDespacho !== 'Listo para Carga' ? 'disabled' : ''} onclick="cambiarEstado(${ruta.RouteNumber}, 'Finalizado')" title="${estadoDespacho !== 'Listo para Carga' ? 'Primero marcá Lista para Carga' : 'Despachar: sale del tablero'}">
                                <i class="bi bi-truck"></i> ${yaCompletado ? 'Despachado' : 'Marcar como Despachado'}
                            </button>
                            <button class="btn-print-cuadro" onclick="printPackingAllProducto(${ruta.RouteNumber})" title="Imprimir todos los packing lists de la ruta">
                                <i class="bi bi-file-earmark-check"></i> Packing List
                            </button>
                            <button class="btn-print-cuadro" onclick="printCuadroRuta(${ruta.RouteNumber})" title="Imprimir Cuadro de Ruta">
                                <i class="bi bi-printer"></i> Cuadro de Ruta
                            </button>
                            <div class="btns-break"></div>
                            <button class="btn-print-cuadro btn-etiquetas" onclick="printEtiquetasProducto(${ruta.RouteNumber})" title="Imprimir etiquetas de empaque 4x8 (una por OV)">
                                <i class="bi bi-tag-fill"></i> Etiquetas de empaque
                            </button>
                        </div>
                    </div>
                    <div class="route-header-grid">
                        <div class="rh-field">
                            <label>Despacho</label>
                            <span class="estado-pill ${despachoPillClass}">${estadoDespacho}</span>
                        </div>
                        <div class="rh-field">
                            <label>Picking</label>
                            <span class="estado-pill ${pickingPillClass}">${estadoPicking} (${pickingPct}%)</span>
                        </div>
                        <div class="rh-field">
                            <label>Peso Estimado</label>
                            <div class="value">${formatNum(ruta.PesoEstimado || 0)} kg</div>
                        </div>
                        <div class="rh-field">
                            <label>Documentos</label>
                            <div class="value">${docsFinalizados}/${docs.length}</div>
                        </div>
                        <div class="rh-field">
                            <label><i class="bi bi-box-seam"></i> Bultos (ruta)</label>
                            <div class="value" id="rutaBultosTotal">—</div>
                        </div>
                        <div class="rh-field">
                            <label><i class="bi bi-truck"></i> Placa</label>
                            <div class="value" id="rutaPlacaVal">…</div>
                        </div>
                    </div>
                    <div class="picking-bar-lg">
                        <div class="fill ${pickingComplete ? 'complete' : 'in-progress'}" style="width:${pickingPct}%"></div>
                    </div>
                </div>

                <div class="docs-header">
                    <i class="bi bi-file-earmark-text" style="color:var(--primary)"></i>
                    Documentos
                    <span class="badge-count">${docs.length}</span>
                </div>

                <div id="docsList">
                    ${docs.map(d => renderDocCard(ruta.RouteNumber, d)).join('')}
                </div>
            `;
            actualizarBultosTotal();
        }

        function renderDocCard(routeNumber, d) {
            const isDone = d.Estado === 'Finalizado';
            const isOpen = openDocs.has(d.OV_Number);

            return `
                <div class="doc-card">
                    <div class="doc-card-header" onclick="toggleDoc('${routeNumber}', '${esc(d.OV_Number)}')">
                        <div class="doc-icon ${isDone ? 'done' : 'pending'}">
                            <i class="bi bi-${isDone ? 'check-circle-fill' : 'circle'}"></i>
                        </div>
                        <div class="doc-info">
                            <div class="doc-name">${esc(d.OV_Number)} <span style="font-size:0.72rem;color:#999;font-weight:400">(${esc(d.DocType)})</span></div>
                            <div class="doc-meta">${d.TotalProductos} producto${d.TotalProductos !== 1 ? 's' : ''} · ${d.ProductosFinalizados}/${d.TotalProductos} completados</div>
                        </div>
                        <div class="doc-right">
                            <div class="doc-weight">${formatNum(d.PesoTotal || 0)} kg</div>
                            <div class="doc-status"><span class="estado-pill ${isDone ? 'picking-finalizado' : 'picking-iniciado'}" style="font-size:0.6rem">${d.Estado}</span></div>
                        </div>
                        <div class="bultos-ctrl" onclick="event.stopPropagation()" title="Cantidad de bultos para las etiquetas de empaque (sugerido por cajas, editable)">
                            <label>Bultos</label>
                            <input type="number" min="1" step="1" class="bultos-input" data-ov="${esc(d.OV_Number)}" value="1" onclick="event.stopPropagation()" oninput="actualizarBultosTotal()">
                        </div>
                        <button class="btn-print-pedido" title="Imprimir packing list de este pedido" onclick="event.stopPropagation(); printPackingProducto('${routeNumber}', '${esc(d.OV_Number)}')">
                            <i class="bi bi-printer"></i>
                        </button>
                        <button class="btn-print-pedido" title="Imprimir etiqueta 4x8 de esta OV" onclick="event.stopPropagation(); printEtiquetaProducto('${routeNumber}', '${esc(d.OV_Number)}')">
                            <i class="bi bi-tag"></i>
                        </button>
                        <i class="bi bi-chevron-right doc-toggle ${isOpen ? 'open' : ''}"></i>
                    </div>
                    <div class="doc-products ${isOpen ? 'open' : ''}" id="doc-${d.OV_Number}"></div>
                </div>
            `;
        }

        async function toggleDoc(routeNumber, ovNumber) {
            const el = document.getElementById('doc-' + ovNumber);
            if (!el) return;

            if (openDocs.has(ovNumber)) {
                openDocs.delete(ovNumber);
                el.classList.remove('open');
                el.innerHTML = '';
                return;
            }

            openDocs.add(ovNumber);
            el.classList.add('open');
            el.innerHTML = '<div style="padding:0.3rem 0;font-size:0.72rem;color:#aaa"><i class="bi bi-hourglass-split"></i> Cargando...</div>';

            try {
                const res = await fetch('/api/despacho/rutas/' + routeNumber + '/documentos/' + encodeURIComponent(ovNumber) + '/productos');
                const productos = await res.json();

                el.innerHTML = productos.map(p => {
                    const pDone = p.Estado === 'Finalizado';
                    const totalQ = Number(p.Cantidad) || 0;
                    const pickedQ = Math.max(0, totalQ - (Number(p.CantidadPendiente) || 0));
                    const qty = pickedQ + '/' + totalQ;
                    return `
                        <div class="prod-row ${p.Verificado ? 'verificado' : ''}">
                            <div class="prod-icon ${pDone ? 'done' : 'pending'}">
                                <i class="bi bi-${pDone ? 'check-circle-fill' : 'circle'}"></i>
                            </div>
                            <div class="prod-name" title="${esc(p.ProductName || '')}">${esc(p.Product)} — ${esc(p.ProductName || '')}</div>
                            <div class="prod-qty ${pDone ? 'done' : ''}">${qty}</div>
                            <label class="qc-check" title="Verificar (control de calidad)">
                                <input type="checkbox" ${p.Verificado ? 'checked' : ''} data-rn="${routeNumber}" data-ov="${esc(ovNumber)}" data-prod="${esc(p.Product)}" onchange="verificarLineaProducto(this)">
                                <span></span>
                            </label>
                        </div>
                    `;
                }).join('');
            } catch (err) {
                el.innerHTML = '<div style="padding:0.3rem 0;font-size:0.72rem;color:#c62828">Error</div>';
            }
        }

        async function cambiarEstado(routeNumber, estado) {
            const labels = {
                'Listo para Carga': 'marcar como Lista para Carga',
                'Finalizado': 'marcar como DESPACHADA (saldrá del tablero)',
                'Pendiente': 'revertir a Pendiente'
            };
            if (!confirm(`Confirmar: ${labels[estado]} ruta #${routeNumber}?`)) return;

            try {
                const res = await fetch('/api/despacho/estado', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ routeNumber, estado })
                });
                const data = await res.json();
                if (!res.ok) { alert(data.error || 'Error'); return; }
                await loadDespacho();
                if (estado !== 'Finalizado') {
                    await selectRoute(routeNumber);
                } else {
                    document.getElementById('panelDetail').innerHTML = '<div class="empty-detail"><i class="bi bi-check-circle"></i><p>Despacho finalizado</p></div>';
                    selectedRoute = null;
                }
            } catch (err) {
                alert('Error de conexion');
            }
        }

        // ── Order mode functions ──

        async function selectRouteOrder(idRoutePlan, routeNumber) {
            selectedRoutePlanId = idRoutePlan;
            selectedRoute = null;
            openDocs = new Set();
            renderCarriles();

            const panel = document.getElementById('panelDetail');
            panel.innerHTML = '<div class="loading-detail"><i class="bi bi-hourglass-split"></i> Cargando...</div>';

            const ruta = despachoData.find(r => r.ID_RoutePlan === idRoutePlan);
            if (!ruta) return;

            try {
                const res = await fetch('/api/order/despacho/rutas/' + idRoutePlan + '/documentos');
                if (!res.ok) {
                    const errData = await res.json().catch(() => ({}));
                    throw new Error(errData.error || 'HTTP ' + res.status);
                }
                const docs = await res.json();
                renderDetailOrder(ruta, docs);
                cargarPlaca(routeNumber);
            } catch (err) {
                console.error('Error cargando documentos order:', err);
                panel.innerHTML = '<div class="loading-detail" style="color:#c62828"><i class="bi bi-exclamation-triangle"></i> Error: ' + esc(err.message) + '</div>';
            }
        }

        function renderDetailOrder(ruta, docs) {
            const panel = document.getElementById('panelDetail');
            const estadoDespacho = ruta.EstadoDespacho || 'Pendiente';
            const estadoPicking = ruta.Estado || 'Iniciado';
            const totalPedidos = ruta.TotalPedidos || 0;
            const pedidosFin = ruta.PedidosFinalizados || 0;
            const pickingPct = totalPedidos > 0 ? Math.round((pedidosFin / totalPedidos) * 100) : 0;
            const pickingComplete = estadoPicking === 'Finalizado';

            let despachoPillClass = 'pendiente';
            if (estadoDespacho === 'Listo para Carga') despachoPillClass = 'listo-carga';
            if (estadoDespacho === 'Finalizado') despachoPillClass = 'finalizado-despacho';

            let pickingPillClass = pickingComplete ? 'picking-finalizado' : 'picking-iniciado';

            const yaCompletado = estadoDespacho === 'Finalizado';
            const docsFinalizados = docs.filter(d => d.Estado === 'Finalizado').length;
            const enEdicion = editMode && editRN === ruta.RouteNumber;
            editDocsActuales = docs; // para re-render parcial del docsList en edición

            panel.innerHTML = `
                <div class="route-header-card">
                    <div class="route-header-top">
                        <div>
                            <div class="route-header-title">#${ruta.RouteNumber} — ${esc(ruta.RouteName || '')} ${ruta.Pais ? '<span style="font-size:0.7rem;background:rgba(212,168,38,0.2);color:#b8941f;padding:0.1rem 0.4rem;border-radius:4px;margin-left:0.4rem">' + ruta.Pais + '</span>' : ''}</div>
                            <div class="route-header-subtitle"><i class="bi bi-signpost-2" style="color:var(--primary)"></i> ${esc(ruta.CarrilNombre || 'Sin carril')}</div>
                        </div>
                        <div class="route-header-btns">
                            <button class="btn-listo" ${(!pickingComplete || estadoDespacho !== 'Pendiente') ? 'disabled' : ''} onclick="cambiarEstadoOrder(${ruta.ID_RoutePlan}, ${ruta.RouteNumber}, 'Listo para Carga')" title="${!pickingComplete ? 'El picking debe estar finalizado' : (estadoDespacho !== 'Pendiente' ? 'Ya está lista para carga' : 'Revisar y marcar como lista para carga')}">
                                <i class="bi bi-box-seam"></i> ${estadoDespacho === 'Pendiente' ? 'Lista para Carga' : 'Lista para Carga ✓'}
                            </button>
                            <button class="btn-completar" ${estadoDespacho !== 'Listo para Carga' ? 'disabled' : ''} onclick="cambiarEstadoOrder(${ruta.ID_RoutePlan}, ${ruta.RouteNumber}, 'Finalizado')" title="${estadoDespacho !== 'Listo para Carga' ? 'Primero marcá Lista para Carga' : 'Despachar: sale del tablero'}">
                                <i class="bi bi-truck"></i> ${yaCompletado ? 'Despachado' : 'Marcar como Despachado'}
                            </button>
                            <div class="header-doc-actions">
                                <div class="print-col">
                                    <button class="btn-print-cuadro" onclick="printPackingAllOrder(${ruta.ID_RoutePlan})" title="Imprimir todos los packing lists de la ruta">
                                        <i class="bi bi-file-earmark-check"></i> Packing List
                                    </button>
                                    <button class="btn-print-cuadro" onclick="printCuadroRoll(${ruta.RouteNumber})" title="Imprimir Cuadro de Ruta + pases de salida (un PDF)">
                                        <i class="bi bi-printer"></i> Cuadro + Pases
                                    </button>
                                    <button class="btn-print-cuadro btn-etiquetas" onclick="printEtiquetasOrder(${ruta.ID_RoutePlan})" title="Imprimir etiquetas de empaque 4x8 (una por OV)">
                                        <i class="bi bi-tag-fill"></i> Etiquetas de empaque
                                    </button>
                                </div>
                                ${(puedeEditarCuadro && userPais === 'GT' && !yaCompletado) ? (enEdicion ? `
                                    <div class="edit-sq-group">
                                        <button class="btn-edit-sq guardar" onclick="guardarEdicionCuadro()" title="Guardar los cambios del cuadro"><i class="bi bi-check2-circle"></i>Guardar</button>
                                        <button class="btn-edit-cancel" onclick="cancelarEdicion()">Cancelar</button>
                                    </div>` : `
                                    <button class="btn-edit-sq" onclick="entrarEdicion(${ruta.RouteNumber}, ${ruta.ID_RoutePlan})" title="Editar documentos del cuadro"><i class="bi bi-pencil-square"></i>Editar</button>`) : ''}
                            </div>
                        </div>
                    </div>
                    <div class="route-header-grid">
                        <div class="rh-field">
                            <label>Despacho</label>
                            <span class="estado-pill ${despachoPillClass}">${estadoDespacho}</span>
                        </div>
                        <div class="rh-field">
                            <label>Picking</label>
                            <span class="estado-pill ${pickingPillClass}">${estadoPicking} (${pickingPct}%)</span>
                        </div>
                        <div class="rh-field">
                            <label>Peso Estimado</label>
                            <div class="value">${formatNum(ruta.PesoEstimado || 0)} kg</div>
                        </div>
                        <div class="rh-field">
                            <label>Pedidos</label>
                            <div class="value">${docsFinalizados}/${docs.length}</div>
                        </div>
                        <div class="rh-field">
                            <label><i class="bi bi-box-seam"></i> Bultos (ruta)</label>
                            <div class="value" id="rutaBultosTotal">—</div>
                        </div>
                        <div class="rh-field">
                            <label><i class="bi bi-truck"></i> Placa</label>
                            <div class="value" id="rutaPlacaVal">…</div>
                            ${puedeEditarCuadro ? `<button class="btn-asignar-placa" onclick="abrirAsignarPlaca(${ruta.RouteNumber})"><i class="bi bi-pencil-square"></i> Asignar placa</button>` : ''}
                        </div>
                    </div>
                    <div class="picking-bar-lg">
                        <div class="fill ${pickingComplete ? 'complete' : 'in-progress'}" style="width:${pickingPct}%"></div>
                    </div>
                    ${enEdicion ? `
                    <div class="edit-add-bar">
                        <div class="eab-row">
                            <select id="editAddTipo"><option value="">Auto</option><option value="OV">OV</option><option value="TR">TR</option><option value="RMA">RMA</option></select>
                            <input type="text" id="editAddNum" placeholder="N° de OV / TR / RMA" autocomplete="off" onkeydown="if(event.key==='Enter'){event.preventDefault();buscarYAgregarDoc();}">
                            <button type="button" onclick="buscarYAgregarDoc()"><i class="bi bi-plus-lg"></i> Agregar documento</button>
                        </div>
                        <div class="eab-preview" id="editAddPreview"></div>
                    </div>` : ''}
                </div>

                <div class="docs-header">
                    <i class="bi bi-receipt" style="color:var(--primary)"></i>
                    Pedidos
                    <span class="badge-count">${docs.length}</span>${enEdicion ? ' <span style="font-size:.72rem;color:#e65100;font-weight:600">· en edición</span>' : ''}
                </div>

                <div id="docsList">
                    ${enEdicion ? editAgregar.map((a, i) => renderAddCard(a, i)).join('') : ''}
                    ${docs.map(d => renderDocCardOrder(d)).join('')}
                </div>
            `;
            actualizarBultosTotal();
        }

        function renderDocCardOrder(d) {
            const isDone = d.Estado === 'Finalizado';
            const linFin = d.LineasFinalizadas || 0;
            const linTotal = d.TotalLineas || 0;
            const isOpen = openDocs.has('order-' + d.ID_OrderPicking);
            const marcadoRm = editMode && editQuitar.has(docKey(d.OV_Number, d.DocType));

            return `
                <div class="doc-card ${marcadoRm ? 'rm-marked' : ''}">
                    <div class="doc-card-header" onclick="toggleDocOrder(${d.ID_OrderPicking})">
                        <div class="doc-icon ${isDone ? 'done' : 'pending'}">
                            <i class="bi bi-${isDone ? 'check-circle-fill' : 'circle'}"></i>
                        </div>
                        <div class="doc-info">
                            <div class="doc-name">${esc(d.OV_Number)} <span style="font-size:0.72rem;color:#999;font-weight:400">(${esc(d.DocType)})</span></div>
                            <div class="doc-meta">${linTotal} lineas · ${linFin}/${linTotal} completadas${d.OperarioNombre ? ' · <strong style="color:var(--success)">' + esc(d.OperarioNombre) + '</strong>' : ''}</div>
                        </div>
                        <div class="doc-right">
                            <div class="doc-weight">${formatNum(d.PesoTotal || 0)} kg</div>
                            <div class="doc-status">${d.PaseGenerado
                                ? `<span class="estado-pill pase-generado" style="font-size:0.6rem" title="Entrega/pase de salida generado en SAP"><i class="bi bi-check-circle-fill"></i> Pase de Salida</span>`
                                : `<span class="estado-pill ${isDone ? 'picking-finalizado' : 'picking-iniciado'}" style="font-size:0.6rem">${d.Estado || 'Pendiente'}</span>`}</div>
                        </div>
                        <div class="bultos-ctrl" onclick="event.stopPropagation()" title="Cantidad de bultos para las etiquetas de empaque (sugerido por cajas, editable)">
                            <label>Bultos</label>
                            <input type="number" min="1" step="1" class="bultos-input" data-ov="${esc(d.OV_Number)}" value="1" onclick="event.stopPropagation()" oninput="actualizarBultosTotal()">
                        </div>
                        <button class="btn-print-pedido" title="Imprimir packing list de este pedido" onclick="event.stopPropagation(); printPackingOrder(${d.ID_OrderPicking})">
                            <i class="bi bi-printer"></i>
                        </button>
                        <button class="btn-print-pedido" title="Imprimir etiqueta 4x8 de esta OV" onclick="event.stopPropagation(); printEtiquetaOrder(${d.ID_OrderPicking}, '${esc(d.OV_Number)}')">
                            <i class="bi bi-tag"></i>
                        </button>
                        ${editMode ? `<button class="btn-doc-rm ${marcadoRm ? 'deshacer' : ''}" title="${marcadoRm ? 'Deshacer la eliminación' : 'Quitar del cuadro'}" onclick="event.stopPropagation(); toggleQuitarDoc('${esc(d.OV_Number)}','${esc(d.DocType)}')">${marcadoRm ? 'Deshacer' : 'Eliminar'}</button>` : ''}
                        <i class="bi bi-chevron-right doc-toggle ${isOpen ? 'open' : ''}"></i>
                    </div>
                    <div class="doc-products ${isOpen ? 'open' : ''}" id="doc-order-${d.ID_OrderPicking}"></div>
                </div>
            `;
        }

        async function toggleDocOrder(idOrderPicking) {
            const key = 'order-' + idOrderPicking;
            const el = document.getElementById('doc-' + key);
            if (!el) return;

            if (openDocs.has(key)) {
                openDocs.delete(key);
                el.classList.remove('open');
                el.innerHTML = '';
                return;
            }

            openDocs.add(key);
            el.classList.add('open');
            el.innerHTML = '<div style="padding:0.3rem 0;font-size:0.72rem;color:#aaa"><i class="bi bi-hourglass-split"></i> Cargando...</div>';

            try {
                const res = await fetch('/api/order/despacho/rutas/0/documentos/' + idOrderPicking + '/productos');
                if (!res.ok) throw new Error(res.status);
                const productos = await res.json();

                el.innerHTML = productos.map(p => {
                    const pDone = p.Estado === 'Finalizado';
                    const totalQ = Number(p.Cantidad) || 0;
                    const pickedQ = Math.max(0, totalQ - (Number(p.CantidadPendiente) || 0));
                    const qty = pickedQ + '/' + totalQ;
                    return `
                        <div class="prod-row ${p.Verificado ? 'verificado' : ''}">
                            <div class="prod-icon ${pDone ? 'done' : 'pending'}">
                                <i class="bi bi-${pDone ? 'check-circle-fill' : 'circle'}"></i>
                            </div>
                            <div class="prod-name" title="${esc(p.ProductName || '')}">${esc(p.Product)} — ${esc(p.ProductName || '')}</div>
                            <div class="prod-qty ${pDone ? 'done' : ''}">${qty}</div>
                            <label class="qc-check" title="Verificar (control de calidad)">
                                <input type="checkbox" ${p.Verificado ? 'checked' : ''} data-op="${idOrderPicking}" data-prod="${esc(p.Product)}" onchange="verificarLineaOrder(this)">
                                <span></span>
                            </label>
                        </div>
                    `;
                }).join('');
            } catch (err) {
                el.innerHTML = '<div style="padding:0.3rem 0;font-size:0.72rem;color:#c62828">Error: ' + err.message + '</div>';
            }
        }

        async function cambiarEstadoOrder(idRoutePlan, routeNumber, estado) {
            const labels = {
                'Listo para Carga': 'marcar como Lista para Carga',
                'Finalizado': 'marcar como DESPACHADA (saldrá del tablero)',
                'Pendiente': 'revertir a Pendiente'
            };
            if (!confirm(`Confirmar: ${labels[estado]} ruta #${routeNumber}?`)) return;

            try {
                const res = await fetch('/api/order/despacho/estado', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ idRoutePlan, estado })
                });
                const data = await res.json();
                if (!res.ok) { alert(data.error || 'Error'); return; }
                await loadDespacho();
                if (estado !== 'Finalizado') {
                    await selectRouteOrder(idRoutePlan, routeNumber);
                } else {
                    document.getElementById('panelDetail').innerHTML = '<div class="empty-detail"><i class="bi bi-check-circle"></i><p>Despacho finalizado</p></div>';
                    selectedRoutePlanId = null;
                }
            } catch (err) {
                alert('Error de conexion');
            }
        }

        async function fetchPlaca(routeNumber) {
            const res = await fetch('/api/despacho/cuadro-ruta/' + routeNumber + '/info?pais=' + userPais);
            if (!res.ok) throw new Error('info');
            return await res.json();
        }

        async function printCuadroRuta(routeNumber) {
            let info;
            try { info = await fetchPlaca(routeNumber); }
            catch { alert('No se pudo validar la unidad. Intenta de nuevo.'); return; }
            if (!info.Placa || String(info.Placa).trim() === '') {
                alert('Cuadro de ruta pendiente de asignar unidad');
                return;
            }
            window.open('/cuadro-ruta-print.html?ruta=' + routeNumber + '&pais=' + userPais, '_blank');
        }

        // Cuadro de ruta (datos del app) + un pase de salida por entrega, en un solo PDF.
        async function printCuadroRoll(routeNumber) {
            let info;
            try { info = await fetchPlaca(routeNumber); }
            catch { alert('No se pudo validar la unidad. Intenta de nuevo.'); return; }
            if (!info.Placa || String(info.Placa).trim() === '') {
                if (!confirm('El cuadro aún no tiene placa asignada. ¿Imprimir igual como BORRADOR?')) return;
            }
            window.open('/cuadro-roll-print.html?ruta=' + routeNumber + '&pais=' + userPais, '_blank');
        }

        // Muestra la placa asignada en la cabecera de la ruta
        async function cargarPlaca(routeNumber) {
            const el = document.getElementById('rutaPlacaVal');
            if (!el) return;
            try {
                const info = await fetchPlaca(routeNumber);
                if (info.Placa && String(info.Placa).trim() !== '') {
                    if (info.Pendiente) {
                        el.innerHTML = info.Placa + ' <span style="font-size:0.72rem;font-weight:600;">(pendiente SAP)</span>';
                        el.classList.add('placa-pendiente');
                    } else {
                        el.textContent = info.Placa;
                        el.classList.remove('placa-pendiente');
                    }
                } else {
                    el.textContent = 'Sin asignar';
                    el.classList.add('placa-pendiente');
                }
            } catch { el.textContent = '—'; }
        }

        // ── Asignar placa (CRUD cuadro, app-first) ──
        let placaModalRouteNumber = null;
        let placaBuscarTimer = null;

        async function abrirAsignarPlaca(routeNumber) {
            placaModalRouteNumber = routeNumber;
            document.getElementById('placaModalRN').textContent = routeNumber;
            document.getElementById('placaBuscarInput').value = '';
            document.getElementById('placaResultList').innerHTML = '<div class="placa-modal-empty">Escribe para buscar una unidad.</div>';
            document.getElementById('placaModalOverlay').classList.add('show');
            setTimeout(() => document.getElementById('placaBuscarInput').focus(), 50);
        }
        function cerrarAsignarPlaca() {
            document.getElementById('placaModalOverlay').classList.remove('show');
            placaModalRouteNumber = null;
        }
        function buscarCamionDebounced() {
            clearTimeout(placaBuscarTimer);
            placaBuscarTimer = setTimeout(buscarCamion, 300);
        }
        async function buscarCamion() {
            const q = document.getElementById('placaBuscarInput').value.trim();
            const list = document.getElementById('placaResultList');
            if (q.length < 1) { list.innerHTML = '<div class="placa-modal-empty">Escribe para buscar una unidad.</div>'; return; }
            list.innerHTML = '<div class="placa-modal-empty">Buscando…</div>';
            try {
                const res = await fetch('/api/cuadro/camiones/buscar?q=' + encodeURIComponent(q));
                if (!res.ok) throw new Error();
                const rows = await res.json();
                if (!rows.length) { list.innerHTML = '<div class="placa-modal-empty">Sin resultados.</div>'; return; }
                list.innerHTML = rows.map(r => {
                    const payload = JSON.stringify({ placa: r.Placa, capacidad: r.Capacidad, idCamion: r.IDCamion, transportista: r.Transportista, cardCode: r.CardCode }).replace(/'/g, '&#39;');
                    const sub = [r.Transportista, r.Piloto].filter(Boolean).join(' · ');
                    const cap = (r.Capacidad != null && r.Capacidad !== '') ? (Number(r.Capacidad).toLocaleString() + ' kg') : '';
                    return `<div class="placa-result" onclick='asignarPlaca(${payload})'>
                        <div><div class="pr-main">${r.Placa}</div><div class="pr-sub">${sub || '—'}</div></div>
                        <div class="pr-cap">${cap}</div>
                    </div>`;
                }).join('');
            } catch { list.innerHTML = '<div class="placa-modal-empty">Error al buscar.</div>'; }
        }
        async function asignarPlaca(cam) {
            if (!placaModalRouteNumber) return;
            const rn = placaModalRouteNumber;
            try {
                const res = await fetch('/api/cuadro/' + rn + '/placa', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(cam)
                });
                const data = await res.json().catch(() => ({}));
                if (!res.ok) { alert(data.mensaje || data.error || 'No se pudo asignar la placa.'); return; }
                cerrarAsignarPlaca();
                cargarPlaca(rn);
            } catch { alert('Error de red al asignar la placa.'); }
        }

        // ── Editar cuadro INLINE (agregar / quitar documentos) ──
        let editMode = false;
        let editRN = null, editRP = null;
        let editDocsActuales = [];
        let editQuitar = new Set();     // claves "OV|TIPO"
        let editAgregar = [];           // [{ov, tipo, cliente, lineas, enCuadroApp, enPrepa}]

        function docKey(ov, tipo) { return String(ov).trim() + '|' + String(tipo).toUpperCase(); }

        function entrarEdicion(rn, rp) {
            editMode = true; editRN = rn; editRP = rp;
            editQuitar = new Set(); editAgregar = [];
            selectRouteOrder(rp, rn); // re-render con las afford. de edición
        }
        function cancelarEdicion() {
            const rp = editRP, rn = editRN;
            editMode = false; editRN = null; editRP = null;
            editQuitar = new Set(); editAgregar = [];
            if (rp) selectRouteOrder(rp, rn);
        }
        // Re-render parcial del listado de documentos (sin tocar la barra de agregar)
        function renderEditDocsList() {
            const list = document.getElementById('docsList');
            if (!list) return;
            const adds = editAgregar.map((a, i) => renderAddCard(a, i)).join('');
            const cards = editDocsActuales.map(d => renderDocCardOrder(d)).join('');
            list.innerHTML = adds + cards;
        }
        function renderAddCard(a, i) {
            const sub = [a.cliente, (a.lineas != null ? a.lineas + ' líneas' : null),
                (a.enCuadroApp && a.enCuadroApp !== editRN) ? ('mover desde cuadro ' + a.enCuadroApp + ' (con avance)') : null].filter(Boolean).join(' · ');
            return `<div class="doc-card add-new">
                <div class="doc-card-header" style="cursor:default">
                    <div class="doc-icon pending"><i class="bi bi-plus-circle"></i></div>
                    <div class="doc-info">
                        <div class="doc-name">${esc(a.ov)} <span style="font-size:0.72rem;color:#999;font-weight:400">(${esc(a.tipo)})</span> <span style="color:#2e7d32;font-size:.7rem;font-weight:700">NUEVO</span></div>
                        <div class="doc-meta">${esc(sub) || 'por agregar'}</div>
                    </div>
                    <div style="flex:1"></div>
                    <button class="btn-doc-rm" onclick="quitarAgregado(${i})">Quitar</button>
                </div>
            </div>`;
        }
        function toggleQuitarDoc(ov, tipo) {
            const key = docKey(ov, tipo);
            if (editQuitar.has(key)) editQuitar.delete(key); else editQuitar.add(key);
            renderEditDocsList();
        }
        function quitarAgregado(i) { editAgregar.splice(i, 1); renderEditDocsList(); }
        async function buscarYAgregarDoc() {
            const numEl = document.getElementById('editAddNum');
            const num = (numEl.value || '').trim();
            const tipo = document.getElementById('editAddTipo').value;
            const prev = document.getElementById('editAddPreview');
            if (!num) { prev.textContent = ''; return; }
            prev.textContent = 'Buscando…';
            try {
                const res = await fetch('/api/cuadro/doc-lookup?doc=' + encodeURIComponent(num) + (tipo ? '&tipo=' + tipo : ''));
                const info = await res.json();
                if (!info.tipo || !info.encontrado) { prev.innerHTML = '<span class="warn">No se encontró ese documento en SAP.</span>'; return; }
                const dtipo = info.tipo;
                const key = docKey(num, dtipo);
                if (editDocsActuales.some(d => docKey(d.OV_Number, d.DocType) === key) && !editQuitar.has(key)) { prev.innerHTML = '<span class="warn">Ese documento ya está en el cuadro.</span>'; return; }
                if (editAgregar.some(a => docKey(a.ov, a.tipo) === key)) { prev.innerHTML = '<span class="warn">Ya está en la lista de agregados.</span>'; return; }
                editAgregar.push({ ov: String(num).replace(/\D/g, ''), tipo: dtipo, cliente: info.cliente, lineas: info.lineas, enCuadroApp: info.enCuadroApp, enPrepa: info.enPrepa });
                let nota = '';
                if (info.enCuadroApp && info.enCuadroApp !== editRN) nota = ' Se moverá desde el cuadro ' + info.enCuadroApp + ' (con su avance).';
                else if (!info.enPrepa) nota = ' Aviso: no está en preparación (U_Estado2≠03).';
                prev.innerHTML = '<span' + (nota ? ' class="warn"' : '') + '>Agregado: ' + esc(dtipo) + ' ' + esc(num) + '.' + esc(nota) + '</span>';
                numEl.value = '';
                renderEditDocsList();
            } catch { prev.innerHTML = '<span class="warn">Error al buscar.</span>'; }
        }
        function guardarEdicionCuadro() {
            const quitarArr = Array.from(editQuitar).map(k => { const [ov, tipo] = k.split('|'); return { ov, tipo }; });
            const agregarArr = editAgregar.map(a => ({ ov: a.ov, tipo: a.tipo }));
            if (!quitarArr.length && !agregarArr.length) { cancelarEdicion(); return; }
            if (quitarArr.length) { mostrarDestinoQuitados(quitarArr, agregarArr); return; }
            ejecutarEdicion(agregarArr, [], null);
        }
        function cerrarDestinoModal() { document.getElementById('editModalOverlay').classList.remove('show'); }
        function mostrarDestinoQuitados(quitarArr, agregarArr) {
            window._editPending = { quitarArr, agregarArr };
            const body = document.getElementById('editModalBody');
            body.innerHTML = `
                <div class="edit-section">
                    <h4>${quitarArr.length} documento(s) a quitar</h4>
                    <p style="font-size:.88rem;color:#445;margin:.2rem 0 .8rem">¿Qué hago con los documentos quitados del cuadro ${editRN}?</p>
                    <div class="destino-choice">
                        <button type="button" onclick='finalizarDestino("nuevo")'><b>Crear cuadro nuevo</b><br><span style="font-size:.8rem;color:#667">Un cuadro complemento (Pendiente, sin placa) con lo quitado.</span></button>
                        <button type="button" onclick='abrirMoverACuadro()'><b>Mover a otro cuadro</b><br><span style="font-size:.8rem;color:#667">Elegir un cuadro existente destino.</span></button>
                        <button type="button" onclick='finalizarDestino("eliminar")'><b>Solo quitar</b><br><span style="font-size:.8rem;color:#667">Se sacan del cuadro; los replanifico después.</span></button>
                    </div>
                    <div id="moverPicker"></div>
                </div>`;
            document.getElementById('editModalOverlay').classList.add('show');
        }
        function abrirMoverACuadro() {
            const picker = document.getElementById('moverPicker');
            picker.innerHTML = `<div style="margin-top:.8rem">
                <input type="text" id="moverQ" placeholder="Buscar cuadro por N° o nombre…" style="width:100%;padding:.5rem .7rem;border:1px solid #cfd8e3;border-radius:6px;box-sizing:border-box" oninput="buscarCuadroDestinoDeb()">
                <div class="placa-result-list" id="moverResultList"><div class="placa-modal-empty">Escribe para buscar.</div></div>
            </div>`;
            document.getElementById('moverQ').focus();
            buscarCuadroDestino();
        }
        let moverTimer = null;
        function buscarCuadroDestinoDeb() { clearTimeout(moverTimer); moverTimer = setTimeout(buscarCuadroDestino, 300); }
        async function buscarCuadroDestino() {
            const q = (document.getElementById('moverQ') || {}).value || '';
            const list = document.getElementById('moverResultList');
            try {
                const res = await fetch('/api/cuadro/cuadros-destino?excluir=' + editRN + '&q=' + encodeURIComponent(q.trim()));
                const rows = await res.json();
                if (!rows.length) { list.innerHTML = '<div class="placa-modal-empty">Sin cuadros.</div>'; return; }
                list.innerHTML = rows.map(r => `<div class="placa-result" onclick='finalizarDestino({"cuadro":${r.RouteNumber}})'>
                    <div><div class="pr-main">Cuadro ${r.RouteNumber}</div><div class="pr-sub">${esc(r.RouteName || '')} · ${r.Docs} docs</div></div>
                    <div class="pr-sub">${esc(r.EstadoDespacho || '')}</div></div>`).join('');
            } catch { list.innerHTML = '<div class="placa-modal-empty">Error.</div>'; }
        }
        function finalizarDestino(destino) {
            const p = window._editPending || {};
            ejecutarEdicion(p.agregarArr || [], p.quitarArr || [], destino);
        }
        async function ejecutarEdicion(agregar, quitar, destino) {
            try {
                const res = await fetch('/api/cuadro/' + editRN + '/editar', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ agregar, quitar, destino })
                });
                const data = await res.json().catch(() => ({}));
                if (!res.ok) { alert(data.error || 'No se pudo guardar la edición.'); return; }
                let msg = [];
                if (data.agregados && data.agregados.length) msg.push('Agregados: ' + data.agregados.join(', '));
                if (data.quitados && data.quitados.length) msg.push('Quitados: ' + data.quitados.join(', '));
                if (data.complemento) msg.push('Cuadro complemento creado (provisional ' + data.complemento.routeNumber + ', pendiente de sincronizar a SAP).');
                if (data.errores && data.errores.length) msg.push('⚠ ' + data.errores.join(' | '));
                if (msg.length) alert(msg.join('\n'));
                cerrarDestinoModal();
                const rp = editRP, rn = editRN;
                editMode = false; editRN = null; editRP = null; editQuitar = new Set(); editAgregar = [];
                if (rp) selectRouteOrder(rp, rn);
            } catch { alert('Error de red al guardar.'); }
        }
